<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:17px;fill:#94a3b8}.badge-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-size:11px;font-weight:600;fill:#e2e8f0}.pulse-circle{animation:pulse 4s infinite ease-in-out}.float-card1{animation:float 6s infinite ease-in-out}.float-card2{animation:float 7s infinite ease-in-out 1.5s}.float-card3{animation:float 5.5s infinite ease-in-out 3s}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1198" height="358" x="1" y="1" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.5" rx="15"/><g opacity=".45"><circle cx="180" cy="90" r="130" fill="#6366f1" class="pulse-circle" filter="url(#glow)"/><circle cx="102