<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 4s infinite ease-in-out;
      }
      .float-card1 {
        animation: float 6s infinite ease-in-out;
      }
      .float-card2 {
        animation: float 7s infinite ease-in-out 1.5s;
      }
      .float-card3 {
        animation: float 5.5s infinite ease-in-out 3s;
      }
      .wave-path {
        animation: waveFlow 8s infinite linear;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.15); }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Dynamic Glowing Background Blobs (Behind all text) -->
  <g opacity="0.45">
    <circle cx="180" cy="90" r="130" fill="#6366f1" filter="url(#glow)" class="pulse-circle" />
    <circle cx="1020" cy="240" r="160" fill="#a855f7" filter="url(#glow)" class="pulse-circle" />
    <circle cx="700" cy="60" r="90" fill="#ec4899" filter="url(#glow)" class="pulse-circle" />
  </g>

  <!-- Circuit / Connection Vector Grid Lines (Background) -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.35">
    <line x1="80" y1="50" x2="1120" y2="50" />
    <line x1="80" y1="310" x2="1120" y2="310" />
    <line x1="240" y1="20" x2="240" y2="340" />
    <line x1="960" y1="20" x2="960" y2="340" />
  </g>

  <!-- Animated Floating Data Node Badges (Background Layers) -->
  <g class="float-card1">
    <g transform="translate(850, 48)">
      <rect width="165" height="38" rx="19" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="23" class="badge-text">⚡ High-Throughput</text>
    </g>
  </g>

  <g class="float-card2">
    <g transform="translate(1005, 105)">
      <rect width="145" height="38" rx="19" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="23" class="badge-text">🧠 Open Weights</text>
    </g>
  </g>

  <g class="float-card3">
    <g transform="translate(890, 162)">
      <rect width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="20" cy="19" r="6" fill="#f59e0b" />
      <text x="36" y="23" class="badge-text">🚀 Real-Time Inference</text>
    </g>
  </g>

  <!-- Dynamic Glowing Accent Line -->
  <rect x="70" y="85" width="6" height="140" rx="3" fill="url(#accentGrad)" />

  <!-- Core Content (Foreground: Always Visible and Clear) -->
  <g transform="translate(95, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 80)">
      <rect width="265" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title-text">
      Open Foundation Models &amp; AI Platforms
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="200" class="subtitle-text">
      The authoritative reference for hosted inference platforms, LPU neoclouds &amp; high-performance
    </text>
    <text x="0" y="225" class="subtitle-text">
      open-source model-serving engines (vLLM, Ollama, llama.cpp, SGLang, and more).
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="14" y="20" class="badge-text">🌐 Cloud APIs</text>

      <rect x="145" y="0" width="145" height="32" rx="8" fill="#31104b" stroke="#7e22ce" stroke-width="1" />
      <text x="14" y="20" class="badge-text">⚡ Model Serving</text>

      <rect x="305" y="0" width="155" height="32" rx="8" fill="#4c0519" stroke="#be123c" stroke-width="1" />
      <text x="14" y="20" class="badge-text">🛠️ Local &amp; Private</text>

      <rect x="475" y="0" width="160" height="32" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1" />
      <text x="14" y="20" class="badge-text">⚖️ TCO &amp; Benchmarks</text>
    </g>
  </g>
</svg>
